<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARフォト図鑑</title>

<style>
body{
    background:#121212;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

h1{
    margin-top:50px;
}

.area-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    max-width:500px;
    margin:auto;
}

.area{
    border:1px solid #444;
    padding:20px;
    border-radius:10px;
    background:#222;
}
</style>

</head>
<body>

<h1>ARフォト図鑑</h1>

<p>地図から辿る写真図鑑</p>

<div class="area-list">

<div class="area">北海道</div>
<div class="area">東北</div>
<div class="area">関東</div>
<div class="area">中部</div>
<div class="area">近畿</div>
<div class="area">中国</div>
<div class="area">四国</div>
<div class="area">九州</div>

</div>

</body>
</html>
